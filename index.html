<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankili IA — Comores</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        :root {
            --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2e3345;
            --primary: #6c5ce7; --accent: #00cec9;
            --text: #e8eaed; --text2: #9aa0b0; --danger: #e74c3c; --success: #00b894;
            --warning: #fdcb6e; --radius: 12px; --radius-sm: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; line-height: 1.5; }

        /* ---------- BANNIÈRE COMORES ---------- */
        .hero {
            position: relative;
            height: 280px;
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 17, 23, 0.35) 0%, rgba(15, 17, 23, 0.75) 60%, var(--bg) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            padding: 1rem;
        }
        .hero-flag {
            display: inline-block;
            width: 78px;
            height: 52px;
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(255, 255, 255, 0.15);
            overflow: hidden;
            margin-bottom: 0.9rem;
            vertical-align: middle;
        }
        .hero-flag img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
        }
        .hero h1 strong { font-weight: 700; }
        .hero p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            font-style: italic;
            margin-top: 0.4rem;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }

        /* ---------- TOP BAR ---------- */
        .top-bar {
            max-width: 1100px;
            margin: -2rem auto 0;
            padding: 0 1.5rem;
            position: relative;
            z-index: 3;
            width: 100%;
        }
        .top-bar-inner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.9rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
        }
        .top-bar-inner .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--danger); flex-shrink: 0;
        }
        .top-bar-inner .status-dot.connected { background: var(--success); }
        .top-bar-inner input {
            flex: 1;
            min-width: 180px;
            padding: 0.55rem 0.85rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.88rem;
            outline: none;
            font-family: inherit;
        }
        .top-bar-inner input:focus { border-color: var(--primary); }
        .top-bar-btn {
            padding: 0.55rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .top-bar-btn:hover { border-color: var(--primary); }

        /* ---------- Config panel ---------- */
        .config-panel {
            display: none;
            max-width: 1100px;
            margin: 0.75rem auto 0;
            padding: 0 1.5rem;
            width: 100%;
        }
        .config-panel.visible { display: block; }
        .config-inner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }
        .config-field { display: flex; flex-direction: column; gap: 0.4rem; }
        .config-field label {
            font-size: 0.75rem; font-weight: 600; color: var(--text2);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .config-hint { font-size: 0.72rem; color: var(--text2); font-style: italic; }

        .config-test-btn {
            padding: 0.55rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .config-test-btn:hover:not(:disabled) { border-color: var(--primary); }
        .config-test-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .config-test-result { font-size: 0.75rem; min-height: 1.2em; margin-top: 0.2rem; line-height: 1.4; }
        .config-test-result.success { color: var(--success); }
        .config-test-result.error { color: var(--danger); }
        .config-test-result.testing { color: var(--warning); }

        /* ---------- Tabs ---------- */
        .tabs {
            display: flex;
            gap: 0.25rem;
            padding: 1.25rem 1.5rem 0;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            overflow-x: auto;
        }
        .tabs button {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tabs button:hover { background: var(--surface2); color: var(--text); }
        .tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* ---------- Main ---------- */
        main { flex: 1; padding: 1.25rem 1.5rem 2rem; max-width: 1100px; margin: 0 auto; width: 100%; }
        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow);
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card h2 .badge {
            font-size: 0.7rem;
            background: var(--surface2);
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            color: var(--text2);
            font-weight: 400;
        }

        .prompt-row { display: flex; gap: 0.6rem; align-items: flex-start; margin-bottom: 1rem; }
        .prompt-row textarea {
            flex: 1;
            min-height: 80px;
            padding: 0.75rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }
        .prompt-row textarea:focus { border-color: var(--primary); }
        .prompt-actions { display: flex; flex-direction: column; gap: 0.4rem; }
        .icon-btn {
            width: 42px; height: 42px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--border); border-color: var(--primary); }
        .icon-btn.recording {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.6); }
            50% { box-shadow: 0 0 0 8px rgba(231, 76, 60, 0); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.9rem;
            margin-bottom: 1rem;
        }
        .option-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .option-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .option-group select,
        .option-group input[type="number"],
        .option-group input[type="text"] {
            padding: 0.55rem 0.75rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.88rem;
            outline: none;
            font-family: inherit;
        }
        .option-group select:focus,
        .option-group input:focus { border-color: var(--primary); }
        .option-group select option { background: var(--surface2); color: var(--text); }

        .info-banner {
            background: rgba(0, 206, 201, 0.08);
            border: 1px solid rgba(0, 206, 201, 0.3);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.9rem;
            font-size: 0.78rem;
            color: var(--accent);
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .gen-btn {
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }
        .gen-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.45); }
        .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .result-area { margin-top: 1.25rem; }
        .result-area .placeholder {
            color: var(--text2);
            font-size: 0.9rem;
            text-align: center;
            padding: 2rem 1rem;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }
        .result-area img {
            max-width: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: block;
            margin: 0 auto;
        }
        .result-area .text-output {
            background: var(--surface2);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid var(--border);
        }

        .result-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .result-actions a, .result-actions button {
            padding: 0.5rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .result-actions a:hover, .result-actions button:hover {
            background: var(--border);
            border-color: var(--primary);
        }

        .translate-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }
        .translate-row label { font-size: 0.8rem; color: var(--text2); }
        .translate-row select {
            padding: 0.4rem 0.6rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.82rem;
            outline: none;
        }
        .translate-row button {
            padding: 0.4rem 0.8rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.82rem;
            cursor: pointer;
        }
        .translate-row button:hover { border-color: var(--primary); }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.85rem 1.25rem;
            box-shadow: var(--shadow);
            font-size: 0.88rem;
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            max-width: 350px;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { border-color: var(--danger); }
        .toast.success { border-color: var(--success); }

        /* ---------- Responsive ---------- */
        @media (max-width: 700px) {
            .hero { height: 220px; }
            .hero h1 { font-size: 1.6rem; }
            .hero p { font-size: 0.8rem; }
            .hero-flag { width: 60px; height: 40px; }
            .top-bar { padding: 0 1rem; margin-top: -1.5rem; }
            .config-panel { padding: 0 1rem; }
            .tabs { padding: 1rem 1rem 0; }
            .tabs button { padding: 0.5rem 0.9rem; font-size: 0.82rem; }
            main { padding: 1rem; }
            .card { padding: 1rem; }
            .options-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
            .prompt-row { flex-direction: column; }
            .prompt-actions { flex-direction: row; width: 100%; }
            .prompt-actions .icon-btn { flex: 1; }
        }
        @media (max-width: 400px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ========== BANNIÈRE COMORES ========== -->
    <div class="hero">
        <div class="hero-content">
            <div class="hero-flag" aria-label="Drapeau des Comores">
                <img src="https://flagcdn.com/w320/km.png"
                     srcset="https://flagcdn.com/w320/km.png 320w, https://flagcdn.com/w640/km.png 640w"
                     sizes="78px"
                     alt="Drapeau des Comores">
            </div>
            <h1><strong>Ankili</strong> IA</h1>
            <p>Génération de texte et d'images — depuis les Comores</p>
        </div>
    </div>

    <!-- ========== BARRE CLÉ API ========== -->
    <div class="top-bar">
        <div class="top-bar-inner">
            <div class="status-dot" id="statusDot"></div>
            <input type="password" id="apiKeyInput" placeholder="Collez votre clé API Ankili (sk-...)" autocomplete="off">
            <button class="top-bar-btn" onclick="toggleConfigPanel()">⚙️ Options</button>
        </div>
    </div>

    <!-- ========== PANNEAU CONFIG ========== -->
    <div class="config-panel" id="configPanel">
        <div class="config-inner">
            <div class="config-field">
                <label>Vérification</label>
                <button class="config-test-btn" id="testConnectionBtn" onclick="testApiConnection()">🔍 Tester la connexion</button>
                <div class="config-test-result" id="testResult"></div>
            </div>
            <div class="config-field">
                <label>Stockage</label>
                <button class="config-test-btn" onclick="clearStoredKey()">🗑️ Effacer la clé sauvegardée</button>
                <div class="config-hint">La clé est conservée localement dans ce navigateur.</div>
            </div>
        </div>
    </div>

    <!-- ========== TABS ========== -->
    <div class="tabs" id="tabs">
        <button class="active" data-panel="panel-text">💬 Texte</button>
        <button data-panel="panel-image">🖼️ Image</button>
    </div>

    <!-- ========== MAIN ========== -->
    <main>

        <!-- TEXTE -->
        <div class="panel active" id="panel-text">
            <div class="card">
                <h2>💬 Génération de texte <span class="badge">Chat</span></h2>
                <div class="translate-row">
                    <label>Langue :</label>
                    <select id="textLangSelect">
                        <option value="fr">Français</option><option value="en">English</option><option value="es">Español</option>
                        <option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option>
                        <option value="ar">العربية</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ru">Русский</option>
                    </select>
                    <button onclick="translatePrompt('textPrompt', 'textLangSelect')">🌐 Traduire</button>
                </div>
                <div class="prompt-row">
                    <textarea id="textPrompt" placeholder="Posez votre question ou donnez une instruction..."></textarea>
                    <div class="prompt-actions"><button class="icon-btn" id="micText" title="Dicter">🎤</button></div>
                </div>
                <div class="options-grid">
                    <div class="option-group">
                        <label>Modèle</label>
                        <select id="textModel">
                            <option value="agnes-2.5-flash">Agnes 2.5 Flash</option>
                            <option value="agnes-2.0-flash">Agnes 2.0 Flash</option>
                        </select>
                    </div>
                    <div class="option-group"><label>Température</label><input type="number" id="textTemp" value="0.7" min="0" max="2" step="0.1"></div>
                </div>
                <button class="gen-btn" id="genTextBtn" onclick="generateText()">✨ Générer le texte</button>
                <div class="result-area" id="textResult"><div class="placeholder">Le résultat apparaîtra ici.</div></div>
            </div>
        </div>

        <!-- IMAGE -->
        <div class="panel" id="panel-image">
            <div class="card">
                <h2>🖼️ Génération d'image <span class="badge">Texte → Image</span></h2>
                <div class="translate-row">
                    <label>Traduire en :</label>
                    <select id="imageLangSelect">
                        <option value="en">English</option><option value="fr">Français</option>
                        <option value="zh">中文</option><option value="ja">日本語</option>
                    </select>
                    <button onclick="translatePrompt('imagePrompt', 'imageLangSelect')">🌐 Traduire</button>
                </div>
                <div class="prompt-row">
                    <textarea id="imagePrompt" placeholder="Décrivez l'image que vous souhaitez générer..."></textarea>
                    <div class="prompt-actions"><button class="icon-btn" id="micImage" title="Dicter">🎤</button></div>
                </div>
                <div class="options-grid">
                    <div class="option-group">
                        <label>Modèle</label>
                        <select id="imageModel">
                            <option value="agnes-image-2.1-flash">Agnes Image 2.1 Flash</option>
                            <option value="agnes-image-2.0-flash">Agnes Image 2.0 Flash</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>Taille</label>
                        <select id="imageSize"><option value="1K">1K</option><option value="2K" selected>2K</option></select>
                    </div>
                    <div class="option-group">
                        <label>Ratio</label>
                        <select id="imageRatio">
                            <option value="1:1">1:1 (Carré)</option>
                            <option value="16:9">16:9 (Paysage)</option>
                            <option value="9:16">9:16 (Portrait)</option>
                            <option value="4:3">4:3</option>
                            <option value="3:4">3:4</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>Style</label>
                        <select id="imageStyle">
                            <option value="">Automatique</option>
                            <option value="photorealistic">Photorealistic</option>
                            <option value="digital art">Digital Art</option>
                            <option value="anime">Anime</option>
                            <option value="3d render">3D Render</option>
                            <option value="oil painting">Peinture à l'huile</option>
                            <option value="watercolor">Aquarelle</option>
                            <option value="cyberpunk">Cyberpunk</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>Environnement</label>
                        <select id="imageEnv">
                            <option value="">Automatique</option>
                            <option value="studio lighting">Studio</option>
                            <option value="natural light">Lumière naturelle</option>
                            <option value="sunset">Coucher de soleil</option>
                            <option value="night city">Ville de nuit</option>
                            <option value="forest">Forêt</option>
                            <option value="ocean">Océan</option>
                            <option value="space">Espace</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>Format</label>
                        <select id="imageFormat"><option value="url">URL</option><option value="b64_json">Base64</option></select>
                    </div>
                </div>
                <button class="gen-btn" id="genImageBtn" onclick="generateImage()">✨ Générer l'image</button>
                <div class="result-area" id="imageResult"><div class="placeholder">L'image générée apparaîtra ici.</div></div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  CONFIGURATION
        // ============================================================
        const BASE_URL = 'https://apihub.agnes-ai.com/v1';
        const TRANSLATE_URL = 'https://translate.googleapis.com/translate_a/single';

        let currentApiKey = '';
        let recognition = null;
        let currentRecordingBtn = null;

        // ============================================================
        //  PANNEAU CONFIG
        // ============================================================
        function toggleConfigPanel() {
            document.getElementById('configPanel').classList.toggle('visible');
        }

        function clearStoredKey() {
            if (!confirm('Effacer la clé API sauvegardée dans ce navigateur ?')) return;
            localStorage.removeItem('agnes_api_key');
            document.getElementById('apiKeyInput').value = '';
            currentApiKey = '';
            document.getElementById('statusDot').classList.remove('connected');
            document.getElementById('testResult').textContent = '';
            document.getElementById('testResult').className = 'config-test-result';
            showToast('🗑️ Clé effacée.', 'success');
        }

        function updateKeyStatus() {
            const key = document.getElementById('apiKeyInput').value.trim();
            document.getElementById('statusDot').classList.toggle('connected', key.length > 10 && key.startsWith('sk-'));
        }

        async function testApiConnection() {
            const key = document.getElementById('apiKeyInput').value.trim();
            const btn = document.getElementById('testConnectionBtn');
            const result = document.getElementById('testResult');

            if (!key) {
                result.textContent = '❌ Saisissez d\'abord une clé.';
                result.className = 'config-test-result error';
                return;
            }
            btn.disabled = true;
            btn.textContent = '⏳ Test...';
            result.textContent = '🔍 Vérification...';
            result.className = 'config-test-result testing';

            try {
                const res = await fetch(`${BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'agnes-2.5-flash', messages: [{ role: 'user', content: 'test' }], max_tokens: 5 })
                });
                if (res.status === 401) throw new Error('401 — Clé invalide.');
                if (res.status === 403) throw new Error('403 — Accès refusé.');
                if (!res.ok) throw new Error(`Erreur ${res.status}.`);

                result.innerHTML = '✅ <strong>Succès !</strong> Clé opérationnelle.';
                result.className = 'config-test-result success';
                localStorage.setItem('agnes_api_key', key);
                document.getElementById('statusDot').classList.add('connected');
            } catch (err) {
                console.error(err);
                result.textContent = '❌ ' + err.message;
                result.className = 'config-test-result error';
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Tester la connexion';
            }
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        document.querySelectorAll('#tabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.panel).classList.add('active');
            });
        });

        // ============================================================
        //  RECONNAISSANCE VOCALE
        // ============================================================
        function initSpeechRecognition(btnId, textareaId, lang = 'fr-FR') {
            const btn = document.getElementById(btnId);
            const textarea = document.getElementById(textareaId);
            btn.addEventListener('click', () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    showToast('Reconnaissance vocale non supportée.', 'error');
                    return;
                }
                if (recognition && currentRecordingBtn) {
                    recognition.stop();
                    currentRecordingBtn.classList.remove('recording');
                    if (currentRecordingBtn === btn) { currentRecordingBtn = null; return; }
                }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SR();
                recognition.lang = lang;
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                recognition.onstart = () => {
                    btn.classList.add('recording');
                    currentRecordingBtn = btn;
                    showToast('🎤 Écoute en cours...', 'success');
                };
                recognition.onresult = (e) => {
                    textarea.value += (textarea.value ? ' ' : '') + e.results[0][0].transcript;
                };
                recognition.onerror = (e) => { showToast('Erreur micro : ' + e.error, 'error'); };
                recognition.onend = () => {
                    btn.classList.remove('recording');
                    currentRecordingBtn = null;
                };
                recognition.start();
            });
        }
        initSpeechRecognition('micText', 'textPrompt');
        initSpeechRecognition('micImage', 'imagePrompt');

        // ============================================================
        //  TRADUCTION
        // ============================================================
        async function translatePrompt(textareaId, selectId) {
            const ta = document.getElementById(textareaId);
            const tl = document.getElementById(selectId).value;
            const text = ta.value.trim();
            if (!text) { showToast('Saisissez d\'abord un texte.', 'error'); return; }
            try {
                showToast('🌐 Traduction en cours...', 'success');
                const url = `${TRANSLATE_URL}?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                ta.value = data[0].map(i => i[0]).join('');
                showToast('✅ Traduction terminée !', 'success');
            } catch (e) { showToast('Erreur de traduction.', 'error'); }
        }

        // ============================================================
        //  CLÉ API
        // ============================================================
        function getApiKey() {
            return (localStorage.getItem('agnes_api_key') || '').trim();
        }

        const apiKeyInput = document.getElementById('apiKeyInput');
        const statusDot = document.getElementById('statusDot');
        apiKeyInput.addEventListener('input', () => {
            currentApiKey = apiKeyInput.value.trim();
            updateKeyStatus();
        });
        apiKeyInput.addEventListener('blur', () => {
            const k = apiKeyInput.value.trim();
            if (k) localStorage.setItem('agnes_api_key', k);
        });

        function apiHeaders() {
            return { 'Authorization': `Bearer ${getApiKey()}`, 'Content-Type': 'application/json' };
        }

        // ============================================================
        //  TEXTE
        // ============================================================
        async function generateText() {
            const prompt = document.getElementById('textPrompt').value.trim();
            const model = document.getElementById('textModel').value;
            const temp = parseFloat(document.getElementById('textTemp').value) || 0.7;
            if (!prompt) { showToast('Saisissez un prompt.', 'error'); return; }
            if (!getApiKey()) { showToast('Clé API requise.', 'error'); return; }
            const btn = document.getElementById('genTextBtn');
            btn.disabled = true; btn.textContent = '⏳ Génération...';
            document.getElementById('textResult').innerHTML = '<div class="placeholder">Génération en cours...</div>';
            try {
                const res = await fetch(`${BASE_URL}/chat/completions`, {
                    method: 'POST', headers: apiHeaders(),
                    body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: temp })
                });
                if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error?.message || `Erreur ${res.status}`); }
                const data = await res.json();
                const content = data.choices?.[0]?.message?.content || 'Aucune réponse.';
                document.getElementById('textResult').innerHTML = `
                    <div class="text-output">${escapeHtml(content)}</div>
                    <div class="result-actions"><button onclick="copyToClipboard(\`${escapeBacktick(content)}\`)">📋 Copier</button></div>
                `;
                showToast('✅ Texte généré !', 'success');
            } catch (err) {
                document.getElementById('textResult').innerHTML = `<div class="placeholder" style="color:var(--danger);">❌ ${escapeHtml(err.message)}</div>`;
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false; btn.textContent = '✨ Générer le texte';
            }
        }

        // ============================================================
        //  IMAGE
        // ============================================================
        async function generateImage() {
            const prompt = document.getElementById('imagePrompt').value.trim();
            const model = document.getElementById('imageModel').value;
            const size = document.getElementById('imageSize').value;
            const ratio = document.getElementById('imageRatio').value;
            const style = document.getElementById('imageStyle').value;
            const env = document.getElementById('imageEnv').value;
            const format = document.getElementById('imageFormat').value;
            if (!prompt) { showToast('Décrivez l\'image.', 'error'); return; }
            if (!getApiKey()) { showToast('Clé API requise.', 'error'); return; }
            let fullPrompt = prompt;
            if (style) fullPrompt += `, style: ${style}`;
            if (env) fullPrompt += `, environment: ${env}`;
            const btn = document.getElementById('genImageBtn');
            btn.disabled = true; btn.textContent = '⏳ Génération...';
            document.getElementById('imageResult').innerHTML = '<div class="placeholder">Génération en cours...</div>';
            try {
                const res = await fetch(`${BASE_URL}/images/generations`, {
                    method: 'POST', headers: apiHeaders(),
                    body: JSON.stringify({ model, prompt: fullPrompt, size, ratio, extra_body: { response_format: format } })
                });
                if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error?.message || `Erreur ${res.status}`); }
                const data = await res.json();
                const img = data.data?.[0];
                let html = '';
                if (img?.url) html = `<img src="${img.url}" alt="Image générée"><div class="result-actions"><a href="${img.url}" download target="_blank">⬇️ Télécharger</a></div>`;
                else if (img?.b64_json) { const src = `data:image/png;base64,${img.b64_json}`; html = `<img src="${src}" alt="Image générée"><div class="result-actions"><a href="${src}" download="ankili-image.png">⬇️ Télécharger</a></div>`; }
                else html = '<div class="placeholder" style="color:var(--danger);">Aucune image retournée.</div>';
                document.getElementById('imageResult').innerHTML = html;
                showToast('✅ Image générée !', 'success');
            } catch (err) {
                document.getElementById('imageResult').innerHTML = `<div class="placeholder" style="color:var(--danger);">❌ ${escapeHtml(err.message)}</div>`;
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false; btn.textContent = '✨ Générer l\'image';
            }
        }

        // ============================================================
        //  UTILITAIRES
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function escapeBacktick(str) {
            return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
        }
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast('📋 Copié !', 'success')).catch(() => showToast('Impossible de copier.', 'error'));
        }
        let toastTimeout = null;
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ============================================================
        //  INIT
        // ============================================================
        (function init() {
            const savedKey = localStorage.getItem('agnes_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                currentApiKey = savedKey;
                statusDot.classList.add('connected');
            }
            console.log('🧠 Ankili IA — Interface prête (texte + image)');
        })();
    </script>
</body>
</html>
